
name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::880636108829:role/GitHubActionsDeployRole
          aws-region: ap-southeast-1

      - name: Deploy application through SSM
        shell: bash
        run: |
          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -e
          sudo -u ubuntu -H bash -lc '
            cd /home/ubuntu/test-_demo/koundinyasa-exam-portal
            docker compose pull backend frontend
            docker compose up -d --no-build
            docker compose ps
            curl -fsS http://localhost/api/health
            curl -fsSI http://localhost
          '
          SCRIPT
          )

          PARAMETERS=$(jq -n --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-02ddeb491a5715327" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy latest Docker Hub images" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-02ddeb491a5715327" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-02ddeb491a5715327" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed or timed out."
            exit 1
          fi
