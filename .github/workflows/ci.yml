name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: exam_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: koundinyasa-exam-portal/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: koundinyasa-exam-portal/backend
        run: npm ci

      - name: Run backend unit tests
        working-directory: koundinyasa-exam-portal/backend
        run: npm run test:unit

      - name: Run database migrations against test container
        working-directory: koundinyasa-exam-portal/backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/exam_portal_test
          NODE_ENV: test
        run: npm run migrate

      - name: Start backend test server
        working-directory: koundinyasa-exam-portal/backend
        env:
          PORT: 5001
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/exam_portal_test
          JWT_SECRET: test-ci-jwt-secret-minimum-32-characters-long
          NODE_ENV: test
        run: |
          node src/server.js &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          READY=false
          for i in {1..30}; do
            if curl -s -f http://localhost:5001/api/health > /dev/null; then
              echo "Backend server is healthy."
              READY=true
              break
            fi
            echo "Waiting for backend server ($i/30)..."
            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "Backend server failed to start within 30 seconds."
            exit 1
          fi

      - name: Run exam-start integration tests
        working-directory: koundinyasa-exam-portal/backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/exam_portal_test
          JWT_SECRET: test-ci-jwt-secret-minimum-32-characters-long
          NODE_ENV: test
        run: npm run test:integration

      - name: Stop backend test server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi
          pkill -f "node src/server.js" 2>/dev/null || true

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: koundinyasa-exam-portal/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: koundinyasa-exam-portal/frontend
        run: npm ci

      - name: Build frontend for production
        working-directory: koundinyasa-exam-portal/frontend
        env:
          VITE_API_URL: http://localhost:5001/api
        run: npm run build
